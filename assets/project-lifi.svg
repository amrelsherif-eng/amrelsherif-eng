<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" role="img" aria-label="Li-Fi Graduation Project: Beam-steered Li-Fi link with seamless Wi-Fi failover."><title>Li-Fi Graduation Project: Beam-steered Li-Fi link with seamless Wi-Fi failover.</title><style>
