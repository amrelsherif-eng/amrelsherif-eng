<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1280 320" role="img" aria-label="Amr Elsherif profile banner">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e6edf3" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1280" height="320" rx="16"/></clipPath>
    <path id="route1" d="M844 112L924 76L1010 112L1096 76L1170 112"/>
    <path id="route2" d="M844 112L914 174L1000 146L1080 196L1170 112"/>
    <path id="route3" d="M924 76L914 174L1000 238L1080 196L1096 76"/>
    <path id="route4" d="M844 112L1000 146L1170 112"/>
    <style>
      text { font-family: "Space Grotesk", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .link { fill: none; stroke: #00f0ff; stroke-opacity: .25; stroke-width: 1; }
      .node { fill: #111a20; stroke: #00f0ff; stroke-opacity: .8; stroke-width: 1.4; }
      .node-alt { fill: #171710; stroke: #ffb300; stroke-opacity: .8; stroke-width: 1.4; }
      .core { fill: #00f0ff; }
      .core-alt { fill: #ffb300; }
      .packet { fill: #00f0ff; filter: url(#glow); }
      @media (prefers-reduced-motion: reduce) { .packet { display: none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="320" fill="#0a0d10"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <text x="64" y="118" fill="#e6edf3" font-size="60" font-weight="700" letter-spacing="-1.5">Amr Elsherif</text>
    <text x="66" y="168" fill="#8b949e" font-size="24" font-weight="500">Network &amp; Cloud Infrastructure  ·  Aspiring DevOps Engineer</text>
    <text x="66" y="228" textLength="690" lengthAdjust="spacingAndGlyphs" fill="#00f0ff" font-size="20" font-weight="500" font-family="JetBrains Mono, Cascadia Code, Consolas, ui-monospace, monospace">$ ccna --in-progress &amp;&amp; aws --academy-graduate &amp;&amp; linux --next</text>
    <rect x="764" y="210" width="11" height="22" rx="1" fill="#00f0ff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.48;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(0 0)">
      <path class="link" d="M844 112L924 76L1010 112L1096 76L1170 112M844 112L914 174L1000 146L1080 196L1170 112M924 76L914 174L1000 238L1080 196L1096 76M844 112L1000 146L1170 112M914 174L1000 146M1000 238L1170 112"/>
      <g fill="none" stroke="#00f0ff" stroke-opacity=".08" stroke-width="1"><circle cx="1000" cy="146" r="48"/><circle cx="1000" cy="146" r="76"/></g>
      <g>
        <circle class="node" cx="844" cy="112" r="10"><animate attributeName="r" values="10;11.5;10" dur="3.4s" repeatCount="indefinite"/></circle><circle class="core" cx="844" cy="112" r="2.5"/>
        <rect class="node" x="916" y="68" width="16" height="16" rx="4"><animate attributeName="stroke-opacity" values=".55;1;.55" dur="4.1s" repeatCount="indefinite"/></rect><circle class="core" cx="924" cy="76" r="2.5"/>
        <circle class="node" cx="1010" cy="112" r="9"><animate attributeName="r" values="9;10.5;9" dur="3.8s" repeatCount="indefinite"/></circle><circle class="core" cx="1010" cy="112" r="2.5"/>
        <rect class="node" x="1088" y="68" width="16" height="16" rx="4"><animate attributeName="stroke-opacity" values=".6;1;.6" dur="3.6s" repeatCount="indefinite"/></rect><circle class="core" cx="1096" cy="76" r="2.5"/>
        <circle class="node" cx="1170" cy="112" r="10"><animate attributeName="r" values="10;11.5;10" dur="4s" repeatCount="indefinite"/></circle><circle class="core" cx="1170" cy="112" r="2.5"/>
        <rect class="node-alt" x="906" y="166" width="16" height="16" rx="5"><animate attributeName="stroke-opacity" values=".55;1;.55" dur="3.5s" repeatCount="indefinite"/></rect><circle class="core-alt" cx="914" cy="174" r="2.5"/>
        <circle class="node" cx="1000" cy="146" r="12"><animate attributeName="r" values="12;14;12" dur="3.2s" repeatCount="indefinite"/></circle><circle class="core" cx="1000" cy="146" r="3"/>
        <rect class="node" x="1072" y="188" width="16" height="16" rx="5"><animate attributeName="stroke-opacity" values=".55;1;.55" dur="4.4s" repeatCount="indefinite"/></rect><circle class="core" cx="1080" cy="196" r="2.5"/>
        <circle class="node" cx="1000" cy="238" r="9"><animate attributeName="r" values="9;10.5;9" dur="3.9s" repeatCount="indefinite"/></circle><circle class="core" cx="1000" cy="238" r="2.5"/>
      </g>
      <g class="packet">
        <circle r="3"><animateMotion dur="3.8s" begin="0s" repeatCount="indefinite"><mpath href="#route1"/></animateMotion></circle>
        <circle r="2.7"><animateMotion dur="4.6s" begin="-1.7s" repeatCount="indefinite"><mpath href="#route2"/></animateMotion></circle>
        <circle r="2.6"><animateMotion dur="5.2s" begin="-2.4s" repeatCount="indefinite"><mpath href="#route3"/></animateMotion></circle>
      </g>
      <circle r="3" class="core-alt" filter="url(#glow)"><animateMotion dur="4.3s" begin="-1.1s" repeatCount="indefinite"><mpath href="#route4"/></animateMotion></circle>
    </g>
  </g>
</svg>
