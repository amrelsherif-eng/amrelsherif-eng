<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 600 790" role="img" aria-labelledby="title desc">
  <title id="title">Learning roadmap pipeline</title>
  <desc id="desc">A vertical GitHub Actions style career learning roadmap from AWS Academy through CCNA, Linux, AWS, and DevOps.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1f2937" stroke-width=".5" opacity=".3"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{fill:#e6edf3}.mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace}.title{font-family:"Space Grotesk","Segoe UI",Inter,Helvetica,Arial,sans-serif;font-weight:700}.muted{fill:#8b949e}.header{font-size:20px}.stage{font-size:30px}.sub{font-size:20px}.status{font-size:20px}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 2.5s linear infinite;transform-box:fill-box;transform-origin:center}.packet{filter:url(#glow)}
      @keyframes pulse{50%{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){.pulse,.spin,.packet,.run-dot{animation:none!important}}
    </style>
  </defs>
  <rect x=".5" y=".5" width="599" height="789" rx="16" fill="#0a0d10" stroke="#1f2937"/>
  <rect x="1" y="1" width="598" height="788" rx="15.5" fill="url(#grid)"/>
  <text x="28" y="39" class="mono muted header">workflow: career.yml</text>
  <circle cx="274" cy="60" r="4.5" fill="#ffb300" class="pulse run-dot"/>
  <text x="576" y="66" text-anchor="end" class="mono muted header">run #2026 · in progress</text>
  <!-- vertical pipeline connectors -->
  <path d="M300 184V196" stroke="#3fb950" stroke-width="2"/>
  <path d="M300 306V319M300 429V442M300 552V565" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 6" opacity=".55"/>
  <circle r="4" fill="#00f0ff" class="packet"><animateMotion dur="2.5s" repeatCount="indefinite" path="M300 184V196"/></circle>
  <!-- done -->
  <g>
    <rect x="40" y="74" width="520" height="110" rx="12" fill="#0d1418" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="77" cy="109" r="12" fill="#3fb950" opacity=".16"/><path d="m71 109 5 5 8-10" fill="none" stroke="#3fb950" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="117" class="title" font-size="25">AWS Academy</text>
    <text x="64" y="149" class="title sub" fill="#8b949e">Cloud Foundations + Architecting</text>
    <text x="64" y="173" class="mono status" fill="#3fb950">done</text>
  </g>
  <!-- CCNA -->
  <g>
    <rect x="40" y="196" width="520" height="110" rx="12" fill="#15120b" stroke="#ffb300" stroke-width="1.7"/>
    <circle cx="78" cy="234" r="15" fill="none" stroke="#ffb300" stroke-width="2.5" stroke-dasharray="64 25" class="spin" filter="url(#glow)"/><circle cx="78" cy="234" r="3.5" fill="#ffb300"/>
    <text x="110" y="244" class="title stage">CCNA</text><text x="64" y="275" class="title sub" fill="#8b949e">Cisco 200-301</text>
    <text x="365" y="276" class="mono status" fill="#ffb300">in progress</text>
  </g>
  <!-- Linux -->
  <g>
    <rect x="40" y="319" width="520" height="110" rx="12" fill="#0c1418" stroke="#00f0ff" stroke-width="1.5" class="pulse"/>
    <circle cx="78" cy="357" r="13" fill="none" stroke="#00f0ff" stroke-width="2" opacity=".8"/>
    <text x="110" y="367" class="title stage">Linux</text><text x="64" y="398" class="title sub" fill="#8b949e">RHCSA</text>
    <text x="390" y="399" class="mono status" fill="#00f0ff">starting</text>
  </g>
  <!-- AWS -->
  <g opacity=".76">
    <rect x="40" y="442" width="520" height="110" rx="12" fill="#0d1115" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="7 6"/>
    <circle cx="78" cy="480" r="13" fill="none" stroke="#8b949e" stroke-width="2"/>
    <text x="110" y="490" class="title stage">AWS</text><text x="64" y="521" class="title sub" fill="#8b949e">Solutions Architect Associate</text>
    <text x="432" y="522" class="mono status muted">queued</text>
  </g>
  <!-- DevOps -->
  <g opacity=".76">
    <rect x="40" y="565" width="520" height="110" rx="12" fill="#0d1115" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="7 6"/>
    <circle cx="78" cy="603" r="13" fill="none" stroke="#8b949e" stroke-width="2"/>
    <text x="110" y="613" class="title stage">DevOps</text><text x="64" y="644" class="title sub" fill="#8b949e">Docker · CI/CD · Terraform</text>
    <text x="432" y="645" class="mono status muted">queued</text>
  </g>
</svg>
